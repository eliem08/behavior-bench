# Example integration for a repository that stores its own cases in examples/cases.jsonl.
# Copy this file to .github/workflows/behavior-bench.yml in the application repository.
name: LLM regression gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "prompts/**"
      - "evals/**"
      - "examples/cases.jsonl"
      - ".github/workflows/behavior-bench.yml"
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_API_BASE_URL: ${{ vars.LLM_API_BASE_URL }}
      LLM_MODEL_ID: ${{ vars.LLM_MODEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check required configuration
        run: |
          test -n "$LLM_API_KEY"
          test -n "$LLM_API_BASE_URL"
          test -n "$LLM_MODEL_ID"
      - name: Install Behavior Bench
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 https://github.com/eliem08/behavior-bench.git .behavior-bench
          python -m pip install -r .behavior-bench/requirements-api.txt
      - name: Run evaluation gate
        run: |
          python .behavior-bench/api_benchmark.py --base-url "$LLM_API_BASE_URL" --model-id "$LLM_MODEL_ID" --api-key-env LLM_API_KEY --cases examples/cases.jsonl --output outputs/behavior-bench --fail-on-regression
      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-bench-report
          path: outputs/behavior-bench/
          if-no-files-found: ignore
