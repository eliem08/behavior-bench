name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch for CI
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Compile application and dashboard modules
        run: python -m py_compile runtime.py app.py main.py dashboard.py
      - name: Compile application and reporting modules
        run: python -m py_compile benchmark.py api_benchmark.py compare_models.py html_report.py provenance.py
      - name: Compile tests
        run: python -m py_compile tests/*.py
      - name: Run tests
        run: python -m pytest -q
